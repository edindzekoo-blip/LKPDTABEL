<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paket Hosting Pilihan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h3>Paket Hosting Pilihan</h3>

    <div class="container">

        <div class="paket">
            <div class="header biru">
                <h4>Paket Free</h4>
                <p>Gratis</p>
            </div>

            <div class="isi">
                <p>Bebas Waktu 3 Bulan</p>
                <p>Kapasitas 200 MB</p>
                <p>Tidak ada backup data</p>
            </div>

            <button class="biru">Pesan Sekarang</button>
        </div>

        <div class="paket">
            <div class="header orange">
                <h4>Paket Premium</h4>
                <p>Rp 240.000,-</p>
            </div>

            <div class="isi">
                <p>Bebas Waktu 1 Tahun</p>
                <p>Kapasitas 1GB</p>
                <p>Dilengkapi Backup Data</p>
            </div>

            <button class="orange">Pesan Sekarang</button>
        </div>

        <div class="paket">
            <div class="header hijau">
                <h4>Paket Profesional</h4>
                <p>Rp 480.000,-</p>
            </div>

            <div class="isi">
                <p>Bebas Waktu 2 Tahun</p>
                <p>Kapasitas 3GB</p>
                <p>Dilengkapi Backup Data</p>
                <p>Bonus Domain</p>
            </div>

            <button class="hijau">Pesan Sekarang</button>
        </div>

    </div>

</body>
</html>
